<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录成功 - 学生主页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
        }
        .success-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 20px;
        }
        .btn-custom {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            margin: 10px;
            transition: transform 0.3s;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            color: white;
        }
        .user-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✅</div>
        <h1 class="mb-4">登录成功！</h1>
        <p class="lead">欢迎来到学生选课系统</p>
        
        <div class="user-info">
            <h5>用户信息</h5>
            <p id="userInfo">正在加载用户信息...</p>
        </div>
        
        <div class="mt-4">
            <button class="btn btn-custom" onclick="goToRealStudentPage()">
                进入真正的学生主页
            </button>
            <button class="btn btn-custom" onclick="logout()">
                退出登录
            </button>
            <button class="btn btn-custom" onclick="testFeatures()">
                测试功能
            </button>
        </div>
        
        <div class="mt-4">
            <small class="text-muted">
                这是一个简化的成功页面，用于演示登录跳转功能
            </small>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script>
        // 页面加载时显示用户信息
        document.addEventListener('DOMContentLoaded', function() {
            const userInfo = Request.getUserInfo();
            const token = Request.getToken();
            
            if (userInfo && token) {
                document.getElementById('userInfo').innerHTML = `
                    <strong>用户名:</strong> ${userInfo.username || '未知'}<br>
                    <strong>权限:</strong> ${userInfo.authority === '1' ? '学生' : userInfo.authority === '2' ? '教师' : '未知'}<br>
                    <strong>Token:</strong> ${token.substring(0, 20)}...
                `;
            } else {
                document.getElementById('userInfo').innerHTML = '未找到用户信息，请重新登录';
            }
        });
        
        function goToRealStudentPage() {
            // 尝试访问真正的学生主页
            window.location.href = '/student/student_home/';
        }
        
        function logout() {
            // 清除本地存储的信息
            Request.clearAuth();
            alert('已退出登录');
            window.location.href = '/login/';
        }
        
        function testFeatures() {
            alert('这里可以添加更多测试功能！\n\n当前用户信息：\n' + 
                  '用户名: ' + (Request.getUserInfo()?.username || '未知') + '\n' +
                  '权限: ' + (Request.getUserInfo()?.authority === '1' ? '学生' : '其他'));
        }
    </script>
</body>
</html>
