{% extends 'fast_base.html' %}

{% block title %}注册 - 智学平台{% endblock %}

{% block extra_css %}
<style>
    .register-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }

    .register-card {
        max-width: 500px;
        width: 100%;
        background: white;
        border-radius: var(--radius-lg);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        padding: 3rem 2rem;
        animation: fadeInUp 0.6s ease-out;
    }

    .register-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .register-header h2 {
        color: var(--text-primary);
        font-weight: 600;
        margin-bottom: 0.5rem;
    }

    .register-header p {
        color: var(--text-secondary);
        font-size: 0.95rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
        font-weight: 500;
    }

    .form-control {
        width: 100%;
        padding: 1rem;
        border: 2px solid #e5e7eb;
        border-radius: var(--radius-md);
        font-size: 1rem;
        transition: all 0.2s ease;
        background: #fafafa;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--primary-color);
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-register {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
        border: none;
        border-radius: var(--radius-md);
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 1rem;
    }

    .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    .login-link {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--text-secondary);
        font-size: 0.9rem;
    }

    .login-link a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 500;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 576px) {
        .register-card {
            padding: 2rem 1.5rem;
            margin: 1rem;
        }
        
        .form-control {
            font-size: 16px; /* 防止iOS缩放 */
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <h2>创建账户</h2>
            <p>填写以下信息完成注册</p>
        </div>

        <form method="post" id="registerForm">
            {% csrf_token %}

            <div class="form-group">
                <label for="username" class="form-label">用户名</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label for="password1" class="form-label">密码</label>
                <input type="password" id="password1" name="password1" class="form-control"
                       placeholder="请输入密码" required>
            </div>

            <div class="form-group">
                <label for="password2" class="form-label">确认密码</label>
                <input type="password" id="password2" name="password2" class="form-control"
                       placeholder="请再次输入密码" required>
            </div>

            <div class="form-group">
                <label for="name" class="form-label">姓名</label>
                <input type="text" id="name" name="name" class="form-control"
                       placeholder="请输入真实姓名" required>
            </div>

            <div class="form-group">
                <label for="student_id" class="form-label">学号</label>
                <input type="text" id="student_id" name="student_id" class="form-control"
                       placeholder="请输入学号" required>
            </div>

            <div class="form-group">
                <label for="college" class="form-label">学院</label>
                <input type="text" id="college" name="college" class="form-control"
                       placeholder="请输入学院" required>
            </div>

            <div class="form-group">
                <label for="contact" class="form-label">联系方式</label>
                <input type="text" id="contact" name="contact" class="form-control"
                       placeholder="请输入联系方式" required>
            </div>

            <button type="submit" class="btn-register">
                创建账户
            </button>
        </form>

        <div class="login-link">
            已有账号？<a href="/login/">立即登录</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    const password1 = document.getElementById('password1').value;
    const password2 = document.getElementById('password2').value;

    if (password1 !== password2) {
        e.preventDefault();
        alert('两次输入的密码不一致，请重新输入');
        return false;
    }
});
</script>
{% endblock %}
