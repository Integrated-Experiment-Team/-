{% extends 'base.html' %}
{% load bootstrap3 %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/course_create.css' %}">
{% endblock %}

{% block content %}
<div class="course-create-container">
    <h1>创建新课程</h1>
    <form method="post" action="{% url 'teacher:teacher_course_create' %}" id="course-create-form">
        {% csrf_token %}
        {% bootstrap_form form %}
        <div class="button-group">
            <button type="submit" class="btn btn-primary create-btn">创建课程</button>
          
    </form>
</div>

<script>
document.getElementById('complete-btn').addEventListener('click', function() {
    var form = document.getElementById('course-create-form');
    form.submit();
});
</script>
{% endblock %}
